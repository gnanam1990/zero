name: MCP protocol regression proof

on:
  push:
    branches: [ci/mcp-protocol-check]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Format evidence
        run: |
          gofmt -w internal/mcp/negotiate.go internal/mcp/negotiate_test.go internal/mcp/protocol_negotiation_integration_test.go internal/mcp/protocol.go internal/mcp/client.go internal/mcp/network_client.go internal/mcp/aimlapi.go
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Test fixed MCP client with race detector
        run: |
          set -o pipefail
          go test -race -count=1 ./internal/mcp 2>&1 | tee "$RUNNER_TEMP/after.log"
      - name: Prove the wire regression fails on main
        run: |
          cp internal/mcp/protocol_negotiation_integration_test.go "$RUNNER_TEMP/protocol_negotiation_integration_test.go"
          git worktree add --detach "$RUNNER_TEMP/zero-before" 06b397846a4779135e52250aa8766ba427823672
          cp "$RUNNER_TEMP/protocol_negotiation_integration_test.go" "$RUNNER_TEMP/zero-before/internal/mcp/"
          cd "$RUNNER_TEMP/zero-before"
          set +e
          go test -count=1 ./internal/mcp -run 'TestHTTPProtocolNegotiationAfterVersionRejection|TestStdioProtocolNegotiation|TestSSEProtocolNegotiation' > "$RUNNER_TEMP/before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/before.log"
          if [ "$result" -eq 0 ]; then echo 'Regression unexpectedly passed on main'; exit 1; fi
          grep -q -- '--- FAIL: TestHTTPProtocolNegotiationAfterVersionRejection' "$RUNNER_TEMP/before.log"
          if grep -q -- 'build failed' "$RUNNER_TEMP/before.log"; then exit 1; fi
      - name: Prove review regressions fail before the parser fix
        run: |
          git fetch --no-tags https://github.com/gnanam1990/zero.git 1d0156f786d94464f7b2bd3c99c26bcaebbf8797
          git worktree add --detach "$RUNNER_TEMP/zero-before-review" 1d0156f786d94464f7b2bd3c99c26bcaebbf8797
          cp internal/mcp/negotiate_test.go "$RUNNER_TEMP/zero-before-review/internal/mcp/"
          cd "$RUNNER_TEMP/zero-before-review"
          set +e
          go test -count=1 ./internal/mcp -run '^TestNegotiateProtocol$' > "$RUNNER_TEMP/review-before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/review-before.log"
          if [ "$result" -eq 0 ]; then echo 'Review regressions unexpectedly passed'; exit 1; fi
          grep -q -- 'escaped_supported_list' "$RUNNER_TEMP/review-before.log"
          grep -q -- 'ignore_unsupported_list' "$RUNNER_TEMP/review-before.log"
          if grep -q -- 'build failed' "$RUNNER_TEMP/review-before.log"; then exit 1; fi
      - name: Verify the reported gh preview regression
        run: |
          git fetch --no-tags https://github.com/Twigpine/zero.git f78520eaa452f8d7971e5409f5c08c3cea721601
          git worktree add --detach "$RUNNER_TEMP/gh-review" f78520eaa452f8d7971e5409f5c08c3cea721601
          cat > "$RUNNER_TEMP/gh-review/internal/sandbox/review_preview_test.go" <<'GO'
          package sandbox
          import "testing"
          func TestReviewGHPreviewValueKeepsNetwork(t *testing.T) {
              for _, script := range []string{"gh api /user --preview --help", "if %ERRORLEVEL% == 0 gh api /user --preview --help"} {
                  risk := classifyCommand(script)
                  if !HasRiskCategory(risk, "network") { t.Errorf("%q: missing network category: %v", script, risk.Categories) }
              }
              if HasRiskCategory(classifyCommand("gh api --help"), "network") { t.Error("genuine help must stay local") }
          }
          GO
          cd "$RUNNER_TEMP/gh-review"
          set +e
          go test -count=1 ./internal/sandbox -run '^TestReviewGHPreviewValueKeepsNetwork$' > "$RUNNER_TEMP/gh-before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/gh-before.log"
          if [ "$result" -eq 0 ]; then echo 'Review finding did not reproduce'; exit 1; fi
          grep -q -- 'missing network category' "$RUNNER_TEMP/gh-before.log"
          sed -i '/"--pattern":/a\	"--preview": true,' internal/sandbox/analyzer.go
          go test -count=1 ./internal/sandbox -run '^TestReviewGHPreviewValueKeepsNetwork$' > "$RUNNER_TEMP/gh-after.log" 2>&1
          cat "$RUNNER_TEMP/gh-after.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-regression-evidence
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/after.log
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/review-before.log
            ${{ runner.temp }}/gh-before.log
            ${{ runner.temp }}/gh-after.log
